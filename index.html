<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>BUGATTI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <h1>BUGATTI</h1>
  <form id="f" role="search">
    <label for="q" class="vh">Profile number</label>
    <input id="q" type="text" inputmode="numeric" autocomplete="off" placeholder="Go to profile number">
    <button type="submit">Show profile</button>
  </form>
  <p id="st" role="status" aria-live="polite"></p>
</header>
<main id="track" aria-label="Bugatti profiles"></main>
<script src="script.js"></script>
</body>
</html>
